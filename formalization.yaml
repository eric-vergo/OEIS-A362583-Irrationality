related_formalizations: []

classification:
  arxiv: ["math.NT"]
  msc2020:
    - "11J72"   # irrationality
    - "11N13"   # primes in progressions (the mod-4 Chebyshev race)

status:
  scope: >-
    Complete. The prime race constant ϱ = Σ_{k≥0} b_k·2^{-(k+1)} — the number whose binary
    expansion is 0.b0b1b2..._2, with b_k = 1 iff the k-th odd prime is ≡ 3 mod 4 — is
    irrational, via a non-degeneracy theorem for the mod-4
    Chebyshev prime race: the race sum is never c·π(N) + O(1). The analytic
    input is only the continued L(s, χ₄), L(1, χ₄) ≠ 0, the Euler product,
    the divergence of Σ 1/p, and the identity theorem — no PNT, no PNT in APs,
    no zero-free regions, no quantitative oscillation (Littlewood/Shiu avoided
    by design).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "A362583.irrational_ϱ"
      file: "A362583/Main.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/comparator.json"
      literature_dependencies: []    # everything is proved here or in mathlib
    - declaration: "A362583.raceSum_not_linear"
      file: "A362583/CaseZero.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []

automation:
  methods:
    - method: "agent"
      models: ["claude-fable-5"]
      framework: "Claude Code"
      tool_setup: >-
        A main-session orchestrator spawning specialized subagents per phase:
        (0) two firewalled agents independently re-derived the analytic core
        from the theorem statement alone, then an adversarial referee checked
        both against the specification before any code; a parallel dependency
        fan-out verified every Mathlib dependency with compiling minimal working
        examples; (1) author + independent reviewer produced the frozen
        statement set; (2-4) one agent per proof
        layer, each owning a single file, checked via lake env lean against a
        shared warm build, merged and committed centrally by the orchestrator;
        (5) two independent auditor agents re-verified the acceptance criteria
        (including a mechanical diff of all locked statements against the
        frozen set) and the informal-to-formal correspondence, with
        adversarial spot-checks. Accumulated Mathlib-pin gotchas were fed
        forward into every subsequent agent prompt.
      cost:
        wall_time: "~1 day (2026-07-03)"
        spend_usd: "subscription-based usage"
        hardware: "API-only; local builds on a MacBook (24 GB RAM), warm Mathlib cache"
      prompting_notes: >-
        Specification-first workflow: a detailed human-authored specification
        with two blocking human sign-off gates (Phase-0 audit/re-derivation
        exit; Phase-1 statement lock). Statements were frozen before any proof
        work; proof agents received the informal blueprint, a verified table of
        Mathlib dependencies, compiling usage examples, and hard guardrails (no
        PNT-strength imports, no axiom patches, no statement changes without a
        lock-break escalation).
  spend_usd: "subscription-based usage"
  notes: >-
    Human role: specification, mathematical review at the two gates, license &
    attribution decisions. All Lean code was written by agents; the human did
    not hand-edit proofs.

fidelity:
  # Statement-lock history. The earlier wording here claimed the current
  # statements are byte-identical to the frozen set; they are not (the constant
  # was renamed after the lock), so the claim below is semantic equivalence,
  # stated as a claim, with the post-lock edits enumerated and the diff named as
  # the artifact a reader can check. The tag is not moved to make the older
  # sentence true.
  divergences: >-
    Statement lock. The statements were frozen before any proof work, at commit
    9404b1d70dcfced842a2f389a27e3acae7b725ed (2026-07-03), in
    A362583/Statements.lean and A362583/Defs.lean. The published annotated tag
    `statement-lock` resolves on the remote and peels to that commit; the full
    commit id remains the immutable identifier. The current statements are NOT
    byte-identical to that frozen set. Three post-lock commits touched
    statement-bearing text. The claim made here is semantic equivalence, not byte
    identity, and it is a claim: the reviewable artifact is
    `git diff 9404b1d..HEAD -- A362583/`.

    (1) 7d54cdd (2026-07-05) renamed the constant and the primary deliverable:
    A362583.x → A362583.ϱ and A362583.irrational_x → A362583.irrational_ϱ. An
    identifier rename; the type expressions are otherwise unchanged.

    (2) 9e6a2ab (2026-07-09) hoisted the summand of raceSum into a new public
    definition A362583.raceKernel, so raceSum's body reads
    `∑ p ∈ (Finset.range (N + 1)).filter Nat.Prime, raceKernel p` where the frozen
    body inlined the if-expression. The two are definitionally equal by
    delta-reduction of raceKernel (A362583.raceSum_eq_sum_raceKernel holds by
    `rfl`). raceKernel is a new declaration that was not in the frozen set.

    (3) 326682f (2026-07-03) dissolved A362583/Statements.lean across the proof
    phases: the six locked declarations moved into Main.lean, CaseZero.lean,
    DigitLayer.lean and RaceCount.lean, and their `sorry` bodies were replaced by
    proofs. A relocation, not a restatement.

    Modulo the rename in (1) and the raceSum refactor in (2), the six locked
    declaration types and the four locked definition bodies are textually
    unchanged. Docstrings and module documentation were rewritten (a5160dd,
    9e6a2ab) and carry no statement content.

    The comparator's certified statement is a separate, derived artifact with its
    own history: the challenge module was introduced after the lock (1d2aeb8,
    2026-07-03), restating the frozen definitions and both theorems in namespace
    A362583; ec0e5da (2026-07-05) narrowed the certified set to the primary
    deliverable, dropping raceSum_not_linear and raceSum from the challenge; and
    152cd0e (2026-07-09) re-namespaced it to Challenge.*. What CI certifies is
    therefore Challenge.irrational_ϱ, proved from A362583.irrational_ϱ across
    `Challenge.ϱ_eq : ϱ = A362583.ϱ := rfl`, with the shared definitions asserted
    byte-identical to A362583/Defs.lean on every run.

    Proof-route deviations from the informal argument: the k=1 layer's analytic
    continuation is *defined* as the discrete by-parts series rather than
    continued after the fact; the Euler-sum split uses a per-prime identity
    instead of a double-sum rearrangement; in both cases (c ≠ 0 and c = 0) the
    contradiction is evaluated at a single explicit point instead of via limits
    (one plain one-sided limit remains, pinning L(1) real-positive); constants
    are deliberately generous rather than sharp.

review:
  status: "self-assessed"
  notes: >-
    No external review. What the repository establishes mechanically, on every
    CI run: the A362583 library is sorry-free and no declaration under its root
    namespace reaches an axiom outside propext, Classical.choice and Quot.sound
    (axiom audit); and leanprover/comparator kernel-replays
    Challenge.irrational_ϱ against an independently stated challenge module,
    inside a Landlock sandbox, with a second, independent kernel (nanoda).
    Statement fidelity — that the formal statement is the intended mathematical
    claim — rests on the author's review at the Phase-1 statement lock and on
    the agent auditors described under `automation`, not on an independent
    reader.

alignment:
  namespace: "A362583"
  statements:
    - source: "definitions (odd primes, bits, the prime race constant ϱ, race sum S)"
      lean: "A362583.oddPrime, A362583.bit, A362583.ϱ, A362583.raceKernel, A362583.raceSum"
      module: "A362583/Defs.lean"
      status: "proved"
      note: "statement-hygiene: elementary %-arithmetic and tsums only; sanity pins proved in A362583/Pins.lean"
    - source: "Both residue classes mod 4 contain infinitely many primes (Dirichlet's theorem)"
      lean: "A362583.bits_infinite_ones, A362583.bits_infinite_zeros"
      module: "A362583/DigitLayer.lean"
      status: "proved"
    - source: "A rational constant has eventually periodic bits (binary-tail pigeonhole)"
      lean: "A362583.eventuallyPeriodic_of_not_irrational"
      module: "A362583/DigitLayer.lean"
      status: "proved"
    - source: "Eventually periodic bits force a linear race sum"
      lean: "A362583.raceSum_linear_of_eventuallyPeriodic"
      module: "A362583/RaceCount.lean"
      status: "proved"
    - source: "Bounded-partial-sum Dirichlet series holomorphy (by-parts continuation)"
      lean: "bpSeries, differentiableOn_bpSeries, tsum_mul_cpow_neg_eq_bpSeries"
      module: "A362583/BoundedHolo.lean"
      status: "proved"
      note: "general-purpose, Mathlib-style; upstream candidate (incl. the cpow increment bound absent from mathlib)"
    - source: "B and T layers of the Euler-product logarithm"
      lean: "A362583.layerB, A362583.layerT"
      module: "A362583/Character.lean"
      status: "proved"
    - source: "Per-prime split of the logarithm series"
      lean: "A362583.neg_log_split"
      module: "A362583/Layers.lean"
      status: "proved"
    - source: "Divergence transfer to the B layer"
      lean: "A362583.exists_layerBReal_gt"
      module: "A362583/Divergence.lean"
      status: "proved"
    - source: "Euler product wired to the continued L-function"
      lean: "A362583.layerA, A362583.tsum_neg_log_eq_layers, A362583.exp_layers_eq_LFunction"
      module: "A362583/EulerLog.lean"
      status: "proved"
    - source: "Forcing the race slope to zero (case c ≠ 0)"
      lean: "A362583.c_eq_zero_of_raceSum_linear"
      module: "A362583/CaseNonzero.lean"
      status: "proved"
    - source: "Nonlinearity of the race — identity theorem and blow-up at 1/2⁺ (main analytic theorem)"
      lean: "A362583.raceSum_not_linear"
      module: "A362583/CaseZero.lean"
      status: "proved"
    - source: "assembly — main theorem"
      lean: "A362583.irrational_ϱ"
      module: "A362583/Main.lean"
      status: "proved"

acknowledgements: >-
  Built on mathlib4 (pinned v4.33.1). The proof route is only feasible because
  mathlib already contains the analytically continued Dirichlet L-function,
  its nonvanishing at s = 1, the exponential form of the Euler product, the
  divergence of the sum of prime reciprocals, and the identity theorem.
