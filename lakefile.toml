name = "A362583"
version = "0.1.0"
keywords = ["math"]
# Only the subject library. The comparator libraries below stay declared —
# the comparator tool builds them by name, and `Challenge`/`Solution` are
# how it does that — but a bare `lake build` must never elaborate them:
# their FIRST elaboration belongs inside the comparator's sandbox, in the
# CI job that holds no write token (codex-audit CX-012).
defaultTargets = ["A362583"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "A362583"
# Apache-2.0 headers with a project-specific author line; the strict Mathlib
# header linter would still reject the exact format, so skip it.
leanOptions = { weak.linter.style.header = false }

[[lean_lib]]
name = "Challenge"
srcDir = "comparator"
# Comparator challenge (see comparator.json): a self-contained restatement of
# the locked claims with `sorry` proofs — sorry *warnings* here are expected
# and by design.  Skip the strict Mathlib header linter.
leanOptions = { weak.linter.style.header = false }

[[lean_lib]]
name = "Solution"
srcDir = "comparator"
# Comparator solution (see comparator.json): the official proof of the challenge
# theorem Challenge.irrational_ϱ, derived from the A362583 library — no `sorry`,
# no axioms beyond the whitelist.  Only the strict Mathlib header linter is
# skipped, for the same project-specific Apache header format as the other libs.
leanOptions = { weak.linter.style.header = false }

[[lean_lib]]
name = "SolutionProbe"
srcDir = "comparator"
# CI-only sandbox regression fixture (see comparator/SolutionProbe.lean and the
# "Denied-write probe" step of the shared verification workflow this repository
# calls, eric-vergo/Showcase `.github/workflows/blueprint-verify.yml`): the
# solution plus an elaboration-time write that Landlock must refuse.
# Deliberately NOT in defaultTargets and imported by nothing — elaborating it
# outside the sandbox writes the canary files it exists to prove impossible.
leanOptions = { weak.linter.style.header = false }
