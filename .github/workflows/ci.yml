name: CI

# Four jobs, split along the trust boundary (codex-audit CX-012: Lean elaboration
# is arbitrary code execution, so the untrusted comparator modules must not be
# elaborated in a job that holds a write token, and must not be elaborated at all
# before the sandbox confines them):
#
#   build      TRUSTED. Source-integrity assertions, formalization.yaml schema
#              validation, and the A362583 build + axiom audit. Builds only the
#              subject library — never Challenge/Solution — and hands its oleans
#              to the next job as an artifact. contents: read.
#   comparator UNTRUSTED. The first elaboration of Challenge and Solution happens
#              here and happens inside landrun, driven by leanprover/comparator.
#              No write token, no OIDC, no Pages scope. Fails closed unless the
#              AF_UNIX guard is available (CX-048), gates the sandbox on a
#              deterministic loopback network canary (CX-049), establishes
#              containment BEFORE any repository Lean is elaborated with a
#              workflow-owned probe (CX-050/CX-051), hashes every executable and
#              certified input immediately before and after the run, and emits
#              comparator-result.json as the sole evidence record.
#   publish    TRUSTED. Validates the result record field by field against its own
#              trusted inputs (scripts/validate_comparator_result.py, CX-052),
#              writes comparator/comparator-status.json from that record
#              (committing it back to main on push events — this is the only job
#              with contents: write), then builds, gates and uploads the blueprint
#              site. The status file must be on disk before the site build: the
#              site bakes it into its comparator page at elaboration time
#              (verso.blueprint.trust.comparatorStatus).
#   deploy     Publishes the Pages artifact.
#
# create-release.yml stays separate (workflow_dispatch only).

on:
  push:
    branches: [main]
    paths-ignore:
      # The comparator's own status-flip commit must not re-trigger this
      # workflow. The commit-back also uses GITHUB_TOKEN, which does not fire
      # `push:` — this paths-ignore is the belt-and-braces second guard.
      - 'comparator/comparator-status.json'
  pull_request:
  workflow_dispatch:

# Deny by default; every job re-declares exactly what it needs.
permissions:
  contents: read

# Serialize per-ref and never cancel in-progress: a cancelled run could
# interrupt the comparator commit-back or a Pages deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  # Zouuup/landrun v0.1.17. Bump deliberately; the verifier cache key derives
  # from these SHAs, so a bump forces a rebuild.
  LANDRUN_REF: "811cfff51ceaf3d9843708aa6d22e9b84ccac8b4"
  # ammkrn/nanoda_lib default-branch HEAD, carrying the kernel fixes that match
  # the Lean version this project pins.
  NANODA_REF: "05055695879dfebb6628a67da88ceca6cd6b0421"
  # leanprover/comparator, pinned by COMMIT like the other two verifiers — a tag
  # is a mutable pointer, and what this repository certifies must not change
  # because someone upstream moved one. COMPARATOR_TOOL_REF is kept only as the
  # human-readable name of that commit: it is what the blueprint tells readers to
  # clone and what `tool_ref` records, and the "Assert comparator tool pin" step
  # fails the run if the tag stops resolving to COMPARATOR_TOOL_SHA. Resolved
  # with `git ls-remote https://github.com/leanprover/comparator.git
  # refs/tags/v4.33.0` (lightweight tag; no peeled `^{}` entry). Bump together.
  COMPARATOR_TOOL_REF: "v4.33.0"
  COMPARATOR_TOOL_SHA: "3927ad383f208ae977c340a91c48ac9b497d2097"
  # The comparator configuration this run certifies. Single source of truth: the
  # "Run comparator" step invokes exactly this file, the hash manifest covers it
  # and the status refresh copies its contents, so the published artifact can
  # never describe a different config than the one that was checked.
  COMPARATOR_CONFIG: "comparator/comparator.json"
  # Same config with `solution_module` swapped for the sandbox regression
  # fixture; see the "Denied-write probe" step.
  COMPARATOR_PROBE_CONFIG: "comparator/comparator-probe.json"
  # mathlib-initiative/formalization.yaml, pinned by commit: a schema fetched
  # from `main` could start or stop rejecting this file without a commit here.
  # The version dispatcher (schema/formalization.schema.json) carries an $id on
  # `main`, so relative $refs inside it would resolve back to `main` and defeat
  # the pin — validate against the versioned schema directly instead, and assert
  # separately that formalization.yaml declares that version.
  FORMALIZATION_SCHEMA_REF: "99c678e569c7c4c0772db297c5ddd5e4c9b6322e"
  FORMALIZATION_SCHEMA_VERSION: "v0.4"
  CHECK_JSONSCHEMA_VERSION: "0.38.0"

jobs:
  # =====================================================================
  # 1. Trusted build: assertions + the subject library. No untrusted Lean.
  # =====================================================================
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      # Reclaim disk BEFORE anything else. A prior run (29533982322) exhausted
      # the ~14 GB free on the hosted runner. Dropping the toolchains this job
      # never touches (Android SDK/NDK, .NET, GHC/Haskell) plus large apt
      # packages frees ~20-25 GB. Keep the hosted tool-cache (elan/go/cargo live
      # outside it but removing it is slow for no gain here), Docker images
      # (removal is slow), and swap (Mathlib elaboration is memory-heavy).
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Disk space after cleanup
        run: df -h /

      # Every third-party action below is pinned by commit SHA with the tag it
      # corresponded to in a trailing comment (resolved via
      # `git ls-remote https://github.com/<owner>/<repo>.git refs/tags/<tag>`;
      # all of them are lightweight tags, so the listed object IS the commit).
      # Marketplace major-version tags are mutable pointers: `@v5` is a promise
      # about compatibility, not about code.
      - name: Check out this repository (solution + challenge + site)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # --- Source-integrity assertions ---------------------------------------
      # The comparator certifies that Solution proves the Challenge statement —
      # it says nothing about whether the Challenge is the claim this project
      # actually makes. Challenge.lean and Solution.lean each re-declare
      # oddPrime / bit / ϱ from scratch (Solution must not import Challenge:
      # they are elaborated in separate environments), and both are supposed to
      # be byte-identical copies of A362583/Defs.lean. Solution.lean's
      # `ϱ_eq : ϱ = A362583.ϱ := rfl` catches drift on the solution side; NOTHING
      # catches drift on the challenge side, where it would quietly weaken the
      # certified claim. This step is that missing check. SolutionProbe.lean is
      # held to the same standard: if it stopped being a faithful copy of the
      # solution, the sandbox probe below would stop testing what it claims to.
      - name: Assert the shared definitions are byte-identical
        run: |
          set -euo pipefail
          # `index($0, s) == 1` is a byte-exact prefix test — no regex engine,
          # so the multibyte identifiers (ϱ, ℝ, ℕ) are compared as bytes and the
          # extraction cannot drift with the awk implementation or the locale.
          extract() {
            awk '
              index($0, "/-- The `k`-th odd prime: `oddPrime 0 = 3`,") == 1 { inblock = 1 }
              inblock { print }
              inblock && index($0, "noncomputable def ϱ : ℝ := ") == 1 { exit }
            ' "$1"
          }
          for f in A362583/Defs.lean comparator/Challenge.lean comparator/Solution.lean \
                   comparator/SolutionProbe.lean; do
            out="${RUNNER_TEMP}/$(printf '%s' "$f" | tr / _).block"
            extract "$f" > "$out"
            lines="$(wc -l < "$out" | tr -d '[:space:]')"
            # 15 = three docstring+definition pairs plus the two blank lines
            # between them. Anything else means an anchor moved and the diff
            # below would be comparing the wrong thing.
            if [ "$lines" -ne 15 ]; then
              echo "definition-block extraction failed for $f: got $lines lines, expected 15"
              exit 1
            fi
          done
          diff "${RUNNER_TEMP}/A362583_Defs.lean.block" "${RUNNER_TEMP}/comparator_Challenge.lean.block"
          diff "${RUNNER_TEMP}/A362583_Defs.lean.block" "${RUNNER_TEMP}/comparator_Solution.lean.block"
          diff "${RUNNER_TEMP}/A362583_Defs.lean.block" "${RUNNER_TEMP}/comparator_SolutionProbe.lean.block"
          echo "oddPrime / bit / ϱ are byte-identical across the four modules."

      # Prose that states a pin must state the true one: formalization.yaml and
      # the Main Theorem chapter both claimed Mathlib v4.31.0 for a full
      # toolchain cycle after the real pin moved to v4.32.0, and nothing noticed.
      - name: Assert stated pins match lean-toolchain
        run: |
          set -euo pipefail
          if ! cmp -s lean-toolchain site/lean-toolchain; then
            echo "lean-toolchain and site/lean-toolchain disagree:"
            diff lean-toolchain site/lean-toolchain || true
            exit 1
          fi
          toolchain="$(cut -d: -f2 lean-toolchain | tr -d '[:space:]')"  # leanprover/lean4:v4.33.1 -> v4.33.1
          files=(README.md formalization.yaml site/Chapters/*.lean)
          # (a) A version named in a "pinned …" sentence must be the toolchain.
          #     Whole-file match (`-0777`, `/s`): these sentences wrap across
          #     lines, so a line-oriented grep would miss them.
          bad="$(perl -0777 -ne 'while (/[Pp]inned.{0,120}?(v4\.\d+\.\d+)/gs) { print "$ARGV: $1\n" }' \
                   "${files[@]}" | grep -v ": ${toolchain}\$" || true)"
          if [ -n "$bad" ]; then
            echo "stated pin disagrees with lean-toolchain (${toolchain}):"
            printf '%s\n' "$bad"
            exit 1
          fi
          # (b) No stray toolchain-shaped version anywhere in those files. The
          #     only two legitimate ones are the toolchain and the comparator
          #     tag (which the repro instructions quote).
          stray="$(grep -RhoE 'v4\.[0-9]+\.[0-9]+' "${files[@]}" | sort -u \
                   | grep -vxF -e "$toolchain" -e "$COMPARATOR_TOOL_REF" || true)"
          if [ -n "$stray" ]; then
            echo "unrecognised version token(s) in reader-facing prose:"
            printf '%s\n' "$stray"
            exit 1
          fi
          echo "stated pins agree with lean-toolchain (${toolchain})."

      # The publish job's validator decides what becomes a dated verifier claim,
      # so its rejection behaviour is itself CI-checked, here, in seconds, before
      # anything expensive runs. The fixtures are forged result records that a
      # weaker validator accepts (codex-audit CX-052).
      - name: Test the comparator result validator against forged records
        run: python3 scripts/tests/test_validate_comparator_result.py

      # formalization.yaml is read by third parties (and by the blueprint's
      # metadata page) as structured data, so it has to actually satisfy the
      # published schema rather than merely look like it does.
      - name: Validate formalization.yaml against the pinned schema
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          declared="$(grep -m1 '^version:' formalization.yaml | tr -d ' "' | cut -d: -f2)"
          if [ "$declared" != "$FORMALIZATION_SCHEMA_VERSION" ]; then
            echo "formalization.yaml declares version '$declared' but CI validates against ${FORMALIZATION_SCHEMA_VERSION}"
            exit 1
          fi
          pipx install "check-jsonschema==${CHECK_JSONSCHEMA_VERSION}"
          check-jsonschema \
            --schemafile "https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/${FORMALIZATION_SCHEMA_REF}/schema/${FORMALIZATION_SCHEMA_VERSION}.schema.json" \
            formalization.yaml

      # Installs elan + the pinned toolchain, restores the Mathlib olean cache
      # and builds the subject library. Challenge and Solution are deliberately
      # NOT built here (CX-012): their first elaboration must happen inside the
      # comparator's sandbox, in the next job, which holds no write token.
      # axiom-audit fails the run if anything under the A362583 root namespace
      # reaches an axiom outside propext / Classical.choice / Quot.sound — which
      # includes `sorry` (sorryAx) and `native_decide` (Lean.ofReduceBool). Both
      # the allowlist and the root namespace are lean-action's defaults (the root
      # is auto-detected from the first lean_lib, `A362583`).
      - name: Set up Lean, build A362583 and audit its axioms
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          lake-package-directory: .
          build-args: "A362583"
          test: false
          lint: false
          axiom-audit: "true"

      # The subject oleans are a trusted input to both later jobs: the sandboxed
      # comparator build imports A362583, and the site build consumes it as a
      # path dependency. Ship them as a tarball so the artifact roundtrip cannot
      # drop hidden files or perturb the paths and mtimes Lake's traces rest on.
      - name: Package the subject oleans
        run: |
          set -euo pipefail
          tar -czf "${RUNNER_TEMP}/subject-oleans.tar.gz" .lake/build
          ls -l "${RUNNER_TEMP}/subject-oleans.tar.gz"

      - name: Upload the subject oleans
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: subject-oleans
          path: ${{ runner.temp }}/subject-oleans.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Disk space after build
        run: df -h /

  # =====================================================================
  # 2. Untrusted verification: the first elaboration of Challenge and
  #    Solution, inside landrun, with no write token and no OIDC.
  # =====================================================================
  comparator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      # Read only, and nothing else: this is the job that runs code the
      # comparator's threat model treats as hostile.
      contents: read
    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Disk space after cleanup
        run: df -h /

      # The pinned comparator documents its guarantee under a systemd-run wrapper
      # with RestrictAddressFamilies=~AF_UNIX, and says the restriction guards a
      # known landrun escape. Whether the runner happens to have a user manager
      # session must not silently change the security property behind an
      # unchanged `verified` verdict (codex-audit CX-048), so the probe is a gate
      # rather than a hint and it runs first: nothing untrusted is elaborated in
      # this job unless the guard is available. The result record carries
      # af_unix_guard, and the publish validator requires it to be "active".
      - name: Assert the AF_UNIX guard is available
        run: |
          set -euo pipefail
          if ! timeout 30 systemd-run --user --pipe --wait --collect \
                 -p RestrictAddressFamilies=~AF_UNIX -- true >/dev/null 2>&1; then
            echo "systemd-run --user with RestrictAddressFamilies=~AF_UNIX is unavailable here."
            echo "The comparator's documented guarantee assumes that guard; this job fails closed"
            echo "rather than elaborating untrusted Lean without it."
            exit 1
          fi
          echo "COMPARATOR_AF_UNIX_GUARD=active" >> "$GITHUB_ENV"
          echo "systemd-run AF_UNIX guard: active"

      - name: Check out this repository (solution + challenge)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check out leanprover/comparator (pinned commit)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: leanprover/comparator
          # The commit, not the tag (see COMPARATOR_TOOL_SHA above). The tag is
          # still asserted to name it by the step right below.
          ref: ${{ env.COMPARATOR_TOOL_SHA }}
          # Check the tool out as `comparator-tool`, NOT `comparator`: the repo
          # tracks a `comparator/` directory (Challenge/Solution + JSON), so
          # `path: comparator` would have actions/checkout clobber it.
          path: comparator-tool
          persist-credentials: false

      - name: Assert comparator tool pin
        working-directory: comparator-tool
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$COMPARATOR_TOOL_SHA" ]; then
            echo "comparator checkout is at $head, expected $COMPARATOR_TOOL_SHA"
            exit 1
          fi
          # The tag is what this repository publishes as the name of that
          # commit, so it has to keep naming it. Annotated tags report the
          # commit under the peeled `^{}` ref, lightweight tags directly —
          # accept whichever is present, require the tag to exist.
          refs="$(git ls-remote https://github.com/leanprover/comparator.git \
                    "refs/tags/${COMPARATOR_TOOL_REF}" "refs/tags/${COMPARATOR_TOOL_REF}^{}")"
          printf '%s\n' "$refs"
          resolved="$(printf '%s\n' "$refs" \
            | awk -v t="refs/tags/${COMPARATOR_TOOL_REF}^{}" '$2 == t { print $1 }')"
          if [ -z "$resolved" ]; then
            resolved="$(printf '%s\n' "$refs" \
              | awk -v t="refs/tags/${COMPARATOR_TOOL_REF}" '$2 == t { print $1 }')"
          fi
          if [ -z "$resolved" ]; then
            echo "tag ${COMPARATOR_TOOL_REF} no longer exists in leanprover/comparator"
            exit 1
          fi
          if [ "$resolved" != "$COMPARATOR_TOOL_SHA" ]; then
            echo "tag ${COMPARATOR_TOOL_REF} moved: it now names $resolved, we pin $COMPARATOR_TOOL_SHA"
            exit 1
          fi
          echo "comparator pin OK: ${COMPARATOR_TOOL_REF} = ${COMPARATOR_TOOL_SHA}"

      # Two reasons the tool must be built with THIS project's toolchain rather
      # than its own: (1) lean4export and the comparator read the project's
      # oleans, which carry a compiler stamp — a tool built on a different Lean
      # release cannot load them; (2) the replay then runs on the kernel of the
      # release this project actually pins, which is the kernel a reader
      # reproducing the check would use. The comparator's sources are a patch
      # release apart at most (the pinned tag names the same minor version as the
      # toolchain, asserted here), so they compile unchanged.
      - name: Pin the comparator tool to this project's toolchain
        run: |
          set -euo pipefail
          toolchain="$(tr -d '[:space:]' < lean-toolchain)"          # leanprover/lean4:v4.33.1
          minor="${COMPARATOR_TOOL_REF%.*}"                          # v4.33.0 -> v4.33
          case "$toolchain" in
            *:"$minor".*) ;;
            *)
              echo "comparator ${COMPARATOR_TOOL_REF} is only known to build on ${minor}.x, but lean-toolchain is ${toolchain}"
              exit 1
              ;;
          esac
          printf '%s\n' "$toolchain" > comparator-tool/lean-toolchain
          cat comparator-tool/lean-toolchain

      # --- Sandbox + second-kernel verifier binaries -------------------------
      # Real landrun (Landlock) replaces the tool's fake-landrun.sh no-op shim,
      # and nanoda_bin provides the independent second kernel for enable_nanoda
      # in comparator/comparator.json. Both are SHA-pinned and cached; no
      # restore-keys on purpose — a binary at the wrong SHA must never be
      # silently reused, a miss just rebuilds (~2-3 min).
      - name: Restore verifier binaries (landrun + nanoda)
        id: verifier-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.verifier-bin
          key: ${{ runner.os }}-verifiers-v1-${{ env.LANDRUN_REF }}-${{ env.NANODA_REF }}

      - name: Build landrun (cache miss only)
        if: steps.verifier-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.verifier-bin"
          # Module path is lowercase (module github.com/zouuup/landrun); the
          # proxy + sumdb verify the module zip and all deps at this exact SHA.
          GOBIN="$HOME/.verifier-bin" go install "github.com/zouuup/landrun/cmd/landrun@${LANDRUN_REF}"

      - name: Build nanoda_bin (cache miss only)
        if: steps.verifier-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.verifier-bin"
          git clone https://github.com/ammkrn/nanoda_lib.git "$RUNNER_TEMP/nanoda_lib"
          git -C "$RUNNER_TEMP/nanoda_lib" checkout --detach "$NANODA_REF"
          # nanoda_lib commits Cargo.lock, so --locked pins the crate graph.
          cargo build --release --locked --manifest-path "$RUNNER_TEMP/nanoda_lib/Cargo.toml"
          install -m 0755 "$RUNNER_TEMP/nanoda_lib/target/release/nanoda_bin" "$HOME/.verifier-bin/nanoda_bin"

      - name: Expose verifier binaries
        run: |
          set -euo pipefail
          test -x "$HOME/.verifier-bin/landrun"
          test -x "$HOME/.verifier-bin/nanoda_bin"
          echo "COMPARATOR_LANDRUN=$HOME/.verifier-bin/landrun" >> "$GITHUB_ENV"
          echo "COMPARATOR_NANODA=$HOME/.verifier-bin/nanoda_bin" >> "$GITHUB_ENV"

      # The landrun (go) + nanoda (cargo) binaries are now safely in
      # ~/.verifier-bin (and cached); their multi-GB build trees are dead weight
      # before the Mathlib-heavy phases. Prune them. Everything here is tolerant
      # of a cache-hit run where the build trees were never created.
      - name: Prune verifier build trees
        run: |
          set -uo pipefail
          rm -rf "$RUNNER_TEMP/nanoda_lib" || true          # cargo target/ + sources
          go clean -cache 2>/dev/null || true               # $HOME/.cache/go-build
          rm -rf "$HOME/go/pkg/mod" 2>/dev/null || true     # go module cache
          df -h /

      # landrun is invoked with --best-effort, which silently degrades to
      # no-sandbox on a Landlock-less kernel. This step turns that silent
      # degradation into a hard failure: if the canary write is not denied, or a
      # TCP connect is not denied, the runner image regressed and the run must
      # not certify anything. Both controls use exactly the ruleset the
      # comparator itself builds (filesystem rules only, no --unrestricted-*),
      # under which go-landlock still handles the network domain and, with no
      # ConnectTCP rule, denies every connect.
      - name: Landlock sandbox self-test
        run: |
          set -euo pipefail
          # Positive control: an allowed command must succeed under landrun.
          "$COMPARATOR_LANDRUN" --best-effort --ro / --rw /dev -ldd -add-exec true
          # Negative control: a write outside the allowed paths must be denied.
          if "$COMPARATOR_LANDRUN" --best-effort --ro / --rw /dev -ldd -add-exec touch "$HOME/landlock-canary" 2>/dev/null; then
            echo "landrun failed to block a write outside the allowed paths"
            exit 1
          fi
          test ! -e "$HOME/landlock-canary"
          # Network canary (codex-audit CX-049). The listener is started here, on
          # loopback, so the assertion depends on nothing outside this runner: no
          # DNS, no egress policy, no third-party endpoint whose availability can
          # quietly remove a stated sandbox assertion. Both branches are hard
          # failures — an unestablished positive control means landrun's denial
          # was never exercised, which is not a green condition.
          port=18923
          mkdir -p "${RUNNER_TEMP}/canary-root"
          python3 -m http.server "$port" --bind 127.0.0.1 --directory "${RUNNER_TEMP}/canary-root" \
            > "${RUNNER_TEMP}/canary-listener.log" 2>&1 &
          listener_pid=$!
          trap 'kill "$listener_pid" 2>/dev/null || true' EXIT
          control=""
          for _ in $(seq 1 50); do
            if curl -fsS --max-time 2 -o /dev/null "http://127.0.0.1:${port}/" 2>/dev/null; then
              control="up"
              break
            fi
            sleep 0.2
          done
          if [ -z "$control" ]; then
            echo "network canary positive control failed: the loopback listener never accepted a connection,"
            echo "so a denial inside the sandbox would prove nothing about landrun."
            cat "${RUNNER_TEMP}/canary-listener.log" || true
            exit 1
          fi
          echo "network canary: positive control connected unsandboxed"
          if "$COMPARATOR_LANDRUN" --best-effort --ro / --rw /dev -ldd -add-exec \
               curl -fsS --max-time 5 -o /dev/null "http://127.0.0.1:${port}/" 2>/dev/null; then
            echo "landrun failed to block a TCP connect under a filesystem-only ruleset"
            exit 1
          fi
          echo "network canary: TCP connect denied inside the sandbox"
          kill "$listener_pid" 2>/dev/null || true
          wait "$listener_pid" 2>/dev/null || true
          trap - EXIT

      # elan + the Mathlib packages only. `build: false` is the whole point: no
      # Lean of this repository is elaborated in this job outside the sandbox.
      # The Lake cache this restores is the one the build job saved under the
      # same key (it includes github.sha), so Mathlib does not have to be
      # re-fetched from scratch.
      - name: Set up Lean and the Mathlib cache (no build)
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          lake-package-directory: .
          build: "false"
          test: false
          lint: false
          use-mathlib-cache: "true"

      # Inside the sandbox every path but the project's .lake is read-only and
      # TCP is denied, so elan can neither download a toolchain nor install one.
      # Have the toolchain that this project and the comparator tool now share
      # on disk before landrun starts.
      - name: Pre-install the pinned toolchain
        run: |
          set -euo pipefail
          elan toolchain install "$(tr -d '[:space:]' < lean-toolchain)"
          elan toolchain list

      # The subject library, built in the trusted job. Restoring it here keeps
      # the sandboxed `lake build Solution` to elaborating Challenge/Solution
      # themselves rather than rebuilding A362583 inside the sandbox.
      - name: Download the subject oleans
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: subject-oleans
          path: ${{ runner.temp }}/subject-oleans

      - name: Unpack the subject oleans
        run: |
          set -euo pipefail
          tar -xzf "${RUNNER_TEMP}/subject-oleans/subject-oleans.tar.gz" -C .
          test -d .lake/build/lib/lean/A362583

      - name: Build the comparator tool and lean4export
        working-directory: comparator-tool
        run: |
          set -euo pipefail
          lake build lean4export comparator
          echo "COMPARATOR_LEAN4EXPORT=${GITHUB_WORKSPACE}/comparator-tool/.lake/packages/lean4export/.lake/build/bin/lean4export" >> "$GITHUB_ENV"

      # --- Trusted pre-run containment evidence (CX-050 / CX-051) ------------
      # Containment has to be established BEFORE the repository's own Lean is
      # elaborated: a probe that runs afterwards cannot retroactively protect the
      # boundary the first elaboration already crossed (CX-050), and a probe that
      # IS a repository file is not independent evidence — a fixture edited to
      # print the expected words while attempting nothing satisfies every
      # acceptance predicate (CX-051).
      #
      # This step is neither. Everything it runs is written here, by this
      # workflow, into a scratch package outside the checkout; the package
      # imports only core Lean (no repository modules, no Mathlib); its two write
      # targets and its denial sentinel are randomised per run and baked into the
      # heredoc, so no repository content can name or forge them; and the outcome
      # is classified from OS-level facts — do the target files exist? — with an
      # unsandboxed positive control first, proving the fixture really does write
      # when nothing stops it. A run that fails without the sentinel is a run
      # that proved nothing, and fails the job.
      #
      # The landrun invocation is the comparator's own, argument for argument
      # (leanprover/comparator Main.lean, buildLandrunArgs + safeLakeBuild at the
      # pinned commit), with the scratch package in place of the project, and it
      # is wrapped in the same systemd-run AF_UNIX guard as the real run.
      - name: Trusted pre-run sandbox self-test
        run: |
          set -euo pipefail
          test "${COMPARATOR_AF_UNIX_GUARD}" = "active"
          nonce="$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          scratch="${RUNNER_TEMP}/sandbox-selftest"
          target_a="${RUNNER_TEMP}/selftest-canary-a-${nonce}"
          target_b="${HOME}/selftest-canary-b-${nonce}"
          rm -rf "$scratch" "$target_a" "$target_b"
          mkdir -p "$scratch/.lake"
          cp lean-toolchain "$scratch/lean-toolchain"
          cat > "$scratch/lakefile.toml" <<'TOML'
          name = "selftest"
          defaultTargets = ["SelfTest"]

          [[lean_lib]]
          name = "SelfTest"
          TOML
          # Unquoted heredoc: the two target paths and the sentinel are expanded
          # into the source at generation time. Keep the body free of $ and
          # backticks so nothing else is expanded.
          cat > "$scratch/SelfTest.lean" <<LEAN
          import Lean.Elab.Command

          namespace SelfTest

          private def targets : Array String :=
            #["${target_a}", "${target_b}"]

          private def tryWrite (target : String) : IO Bool := do
            try
              IO.FS.writeFile (System.FilePath.mk target) "sandbox self-test write"
              return true
            catch _ =>
              return false

          private def attemptEscape : IO (Array String) := do
            let mut written : Array String := #[]
            for target in targets do
              if (← tryWrite target) then
                written := written.push target
            return written

          end SelfTest

          run_cmd do
            let written ← SelfTest.attemptEscape
            if written.isEmpty then
              throwError "SELFTEST_WRITES_DENIED_${nonce}"
            else
              IO.println "SELFTEST_WRITES_ACCEPTED_${nonce}"
          LEAN
          cat "$scratch/SelfTest.lean"

          # 1. Positive control, unsandboxed. Without this the sandboxed run
          #    below cannot distinguish "the writes were refused" from "the
          #    fixture never attempted them".
          pos="${RUNNER_TEMP}/selftest-unsandboxed.log"
          set +e
          ( cd "$scratch" && LEAN_ABORT_ON_PANIC=1 lake build SelfTest ) > "$pos" 2>&1
          pos_rc=$?
          set -e
          cat "$pos"
          if [ ! -e "$target_a" ] || [ ! -e "$target_b" ]; then
            echo "self-test positive control failed (exit ${pos_rc}): the probe did not write both targets"
            echo "outside any sandbox, so a later denial would prove nothing."
            exit 1
          fi
          if ! grep -q "SELFTEST_WRITES_ACCEPTED_${nonce}" "$pos"; then
            echo "self-test positive control failed: the acceptance sentinel was not emitted"
            exit 1
          fi
          rm -f "$target_a" "$target_b"
          echo "self-test positive control: both writes succeeded outside the sandbox"

          # 2. The same bytes, through the full wrapper. Clearing .lake/build is
          #    what forces re-elaboration: a warm build directory is exactly how
          #    CX-012 turned the sandboxed build into a no-op. lake-manifest.json
          #    and .lake itself stay, as they do in the real project checkout.
          rm -rf "$scratch/.lake/build"
          lean_prefix="$(cd "$scratch" && lean --print-prefix)"
          git_location="$(command -v git)"
          sand="${RUNNER_TEMP}/selftest-sandboxed.log"
          set +e
          systemd-run --user --pipe --wait --collect \
            -p RestrictAddressFamilies=~AF_UNIX \
            --working-directory "$scratch" \
            -E PATH="$PATH" \
            -E HOME="$HOME" \
            -E LEAN_ABORT_ON_PANIC=1 \
            -- "$COMPARATOR_LANDRUN" --best-effort --ro / --rw /dev -ldd -add-exec \
                 --env PATH --env HOME --env LEAN_ABORT_ON_PANIC \
                 --ro "$scratch" --rwx "$scratch/.lake" \
                 --rox "$lean_prefix" --rox "$git_location" \
                 -- lake build SelfTest > "$sand" 2>&1
          sand_rc=$?
          set -e
          cat "$sand"
          for target in "$target_a" "$target_b"; do
            if [ -e "$target" ]; then
              echo "SANDBOX BREACH: the pre-run self-test wrote ${target} from inside the sandbox"
              exit 1
            fi
          done
          if [ "$sand_rc" -eq 0 ]; then
            echo "SANDBOX BREACH: the pre-run self-test elaborated successfully inside the sandbox"
            exit 1
          fi
          if grep -q "SELFTEST_WRITES_ACCEPTED_${nonce}" "$sand"; then
            echo "SANDBOX BREACH: the pre-run self-test reported an accepted write inside the sandbox"
            exit 1
          fi
          if ! grep -q "SELFTEST_WRITES_DENIED_${nonce}" "$sand"; then
            echo "the sandboxed self-test failed without reaching the write attempt (exit ${sand_rc}):"
            echo "no containment conclusion can be drawn, so this run certifies nothing."
            exit 1
          fi
          echo "pre-run self-test OK: elaboration-time writes denied inside the sandbox (exit ${sand_rc})"
          jq -n --arg tier "pre-run-trusted" --argjson rc "$sand_rc" \
                --arg a "$target_a" --arg b "$target_b" \
            '{tier: $tier, exit_code: $rc, denied: true, sentinel_observed: true, targets: [$a, $b]}' \
            > "${RUNNER_TEMP}/selftest.json"
          rm -rf "$scratch"

      # --- Integrity across the verification gap -----------------------------
      # One script, run immediately before and immediately after the certified
      # run, so the two manifests are computed identically and a difference can
      # only mean the machinery or the certified sources changed mid-flight.
      - name: Prepare the input-hash manifest script
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/hash-inputs.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          out="$1"
          pairs="${out}.pairs"
          : > "$pairs"
          emit() { printf '%s\t%s\n' "$1" "$(sha256sum "$2" | cut -d' ' -f1)" >> "$pairs"; }
          emit comparator        "${GITHUB_WORKSPACE}/comparator-tool/.lake/build/bin/comparator"
          emit lean4export       "${COMPARATOR_LEAN4EXPORT}"
          emit landrun           "${COMPARATOR_LANDRUN}"
          emit nanoda            "${COMPARATOR_NANODA}"
          emit comparator_config "${GITHUB_WORKSPACE}/${COMPARATOR_CONFIG}"
          emit challenge_lean    "${GITHUB_WORKSPACE}/comparator/Challenge.lean"
          emit solution_lean     "${GITHUB_WORKSPACE}/comparator/Solution.lean"
          jq -Rn '[inputs | split("\t") | {(.[0]): .[1]}] | add' "$pairs" > "$out"
          rm -f "$pairs"
          cat "$out"
          SH
          chmod +x "${RUNNER_TEMP}/hash-inputs.sh"

      - name: Hash the verification inputs (before)
        run: |
          set -euo pipefail
          echo "COMPARATOR_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          "${RUNNER_TEMP}/hash-inputs.sh" "${RUNNER_TEMP}/hashes-before.json"

      - name: Run comparator
        # COMPARATOR_LANDRUN / COMPARATOR_NANODA / COMPARATOR_LEAN4EXPORT all
        # come from GITHUB_ENV. The sandboxed `lake build` steps are a real cold
        # build now: this is where Challenge and Solution are elaborated for the
        # first time, which is the point of the job split.
        run: |
          set -euo pipefail
          # Run from the solution repo root so `lake env` supplies A362583's
          # LEAN_PATH (Mathlib et al.) to the comparator and its child `lake`
          # invocations.
          cmd=(lake env "${GITHUB_WORKSPACE}/comparator-tool/.lake/build/bin/comparator" "${COMPARATOR_CONFIG}")
          # The AF_UNIX guard (comparator README: a known landrun escape uses
          # AF_UNIX, and systemd-run masks it) was asserted available at the top
          # of this job and is applied unconditionally here. There is no
          # unwrapped fallback: a run without the guard is a different security
          # property and must not reach the same verdict (CX-048).
          test "${COMPARATOR_AF_UNIX_GUARD}" = "active"
          exec systemd-run --user --pipe --wait --collect \
            -p RestrictAddressFamilies=~AF_UNIX \
            --working-directory "$PWD" \
            -E PATH="$PATH" \
            -E COMPARATOR_LANDRUN="$COMPARATOR_LANDRUN" \
            -E COMPARATOR_NANODA="$COMPARATOR_NANODA" \
            -E COMPARATOR_LEAN4EXPORT="$COMPARATOR_LEAN4EXPORT" \
            -- "${cmd[@]}"

      - name: Hash the verification inputs (after)
        run: |
          set -euo pipefail
          echo "COMPARATOR_FINISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          "${RUNNER_TEMP}/hash-inputs.sh" "${RUNNER_TEMP}/hashes-after.json"

      # DEFENSE IN DEPTH, not the containment evidence. The containment evidence
      # is the trusted pre-run self-test above; this step re-runs the same shape
      # of check through the comparator's own driver and against the real
      # solution's imports, which the scratch package deliberately does not have.
      #
      # Its known limitation (codex-audit CX-051): comparator/SolutionProbe.lean
      # is a repository file, and the source-integrity assertion in the build job
      # covers only the shared oddPrime/bit/ϱ block, not the write attempt. A
      # fixture edited to throw the sentinel without attempting anything would
      # satisfy all three predicates below. That is precisely why it is no longer
      # the first or the only evidence: the pre-run self-test runs
      # workflow-owned bytes with workflow-chosen targets and classifies the
      # result from the filesystem. The predicates are kept because they still
      # detect a real regression in the driver, and they still fail closed.
      #
      # comparator/SolutionProbe.lean is comparator/Solution.lean plus a
      # top-level `run_cmd` that tries to write outside the sandbox before any
      # declaration is elaborated:
      #   * every write denied -> the fixture aborts elaboration with the
      #     sentinel, the sandboxed `lake build` fails, the comparator exits
      #     non-zero. That is the passing outcome, and the sentinel is what
      #     distinguishes it from an unrelated failure.
      #   * any write accepted -> the fixture stays silent, proves the challenge
      #     statement, the comparator exits 0 and the canary files exist. Both
      #     signals fail this step.
      - name: Denied-write probe (defense in depth)
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/probe.log"
          set +e
          lake env "${GITHUB_WORKSPACE}/comparator-tool/.lake/build/bin/comparator" \
            "${COMPARATOR_PROBE_CONFIG}" > "$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          for canary in "${GITHUB_WORKSPACE}/comparator-probe-canary" "${HOME}/comparator-probe-canary"; do
            if [ -e "$canary" ]; then
              echo "SANDBOX BREACH: the probe wrote $canary from inside the sandbox"
              exit 1
            fi
          done
          if [ "$rc" -eq 0 ]; then
            echo "SANDBOX BREACH: the probe solution elaborated and verified; its write was not denied"
            exit 1
          fi
          if ! grep -q 'COMPARATOR_PROBE_WRITES_DENIED' "$log"; then
            echo "the probe run failed without the denial sentinel: cannot conclude the sandbox blocked the write"
            exit 1
          fi
          echo "probe OK: the elaboration-time writes were denied (comparator exit ${rc})"
          jq -n --arg config "$COMPARATOR_PROBE_CONFIG" --argjson rc "$rc" \
                --arg tier "defense-in-depth" \
            '{config: $config, exit_code: $rc, denied: true, tier: $tier}' > "${RUNNER_TEMP}/probe.json"

      # The single evidence record. Everything the published status will claim is
      # derived here, in the job that actually ran the check, from the config
      # that was passed to the tool and from this run's own pins and hashes.
      - name: Compose the comparator result record
        run: |
          set -euo pipefail
          if ! diff <(jq -S . "${RUNNER_TEMP}/hashes-before.json") \
                    <(jq -S . "${RUNNER_TEMP}/hashes-after.json"); then
            echo "a verification input changed during the comparator run"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/result"
          jq -n \
            --slurpfile cfg "$COMPARATOR_CONFIG" \
            --slurpfile pre "${RUNNER_TEMP}/hashes-before.json" \
            --slurpfile post "${RUNNER_TEMP}/hashes-after.json" \
            --slurpfile probe "${RUNNER_TEMP}/probe.json" \
            --slurpfile selftest "${RUNNER_TEMP}/selftest.json" \
            --arg config "$COMPARATOR_CONFIG" \
            --arg af_unix_guard "$COMPARATOR_AF_UNIX_GUARD" \
            --arg started_at "$COMPARATOR_STARTED_AT" \
            --arg finished_at "$COMPARATOR_FINISHED_AT" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg tool_ref "$COMPARATOR_TOOL_REF" \
            --arg tool_sha "$COMPARATOR_TOOL_SHA" \
            --arg tool_toolchain "$(tr -d '[:space:]' < comparator-tool/lean-toolchain)" \
            --arg toolchain "$(tr -d '[:space:]' < lean-toolchain)" \
            --arg landrun_ref "$LANDRUN_REF" \
            --arg nanoda_ref "$NANODA_REF" \
            '($cfg[0]) as $c
             | { verdict: "verified",
                 repository: $repository,
                 commit: $commit,
                 run_id: $run_id,
                 started_at: $started_at,
                 finished_at: $finished_at,
                 config: $config,
                 challenge_module: $c.challenge_module,
                 solution_module: $c.solution_module,
                 theorem_names: ($c.theorem_names // []),
                 permitted_axioms: ($c.permitted_axioms // []),
                 nanoda_replay: (($c.enable_nanoda // false) == true),
                 toolchain: $toolchain,
                 tool_ref: $tool_ref,
                 tool_sha: $tool_sha,
                 tool_toolchain: $tool_toolchain,
                 landrun_ref: $landrun_ref,
                 nanoda_ref: $nanoda_ref,
                 af_unix_guard: $af_unix_guard,
                 inputs_sha256_before: $pre[0],
                 inputs_sha256_after: $post[0],
                 sandbox_selftest: $selftest[0],
                 sandbox_write_probe: $probe[0] }
             | if (.challenge_module // "") == "" or (.solution_module // "") == ""
                  or (.theorem_names | length) == 0 or (.permitted_axioms | length) == 0 then
                 error("comparator.json is missing challenge_module / solution_module / theorem_names / permitted_axioms")
               else . end' > "${RUNNER_TEMP}/result/comparator-result.json"
          cp "${RUNNER_TEMP}/hashes-before.json" "${RUNNER_TEMP}/hashes-after.json" \
             "${RUNNER_TEMP}/probe.log" "${RUNNER_TEMP}/selftest-unsandboxed.log" \
             "${RUNNER_TEMP}/selftest-sandboxed.log" "${RUNNER_TEMP}/result/"
          cat "${RUNNER_TEMP}/result/comparator-result.json"

      - name: Upload the comparator result record
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: comparator-result
          path: ${{ runner.temp }}/result
          retention-days: 30
          if-no-files-found: error

      - name: Disk space after verification
        run: df -h /

  # =====================================================================
  # 3. Trusted publication: status record -> comparator-status.json, then
  #    the blueprint site. The only job that can write to the repository.
  # =====================================================================
  publish:
    needs: comparator
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write   # commit comparator-status.json back to main (push events only)
      actions: read     # resolve the step-level deep link into the comparator job's log
      pages: write      # actions/configure-pages
      # No id-token: minting the Pages OIDC token stays in the deploy job.
    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Disk space after cleanup
        run: df -h /

      - name: Check out this repository (site + status file)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Do NOT leave the write-capable token in .git/config for the whole
          # job. The commit-back step below authenticates its single push.
          persist-credentials: false

      - name: Download the comparator result record
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: comparator-result
          path: ${{ runner.temp }}/result

      - name: Download the subject oleans
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: subject-oleans
          path: ${{ runner.temp }}/subject-oleans

      # The site consumes A362583 as a path dependency; unpacking the trusted
      # build's oleans keeps `lake build Contents` from recompiling it.
      - name: Unpack the subject oleans
        run: |
          set -euo pipefail
          tar -xzf "${RUNNER_TEMP}/subject-oleans/subject-oleans.tar.gz" -C .
          test -d .lake/build/lib/lean/A362583

      # Nothing downstream may take the result record on faith. The record is the
      # sole input to the write-capable status refresh below, so every field it
      # publishes is re-derived or compared here against something this job
      # trusts: the workflow constants above, the checked-out comparator config,
      # the GitHub context, this checkout's own source digests, and this job's
      # clock. Unknown keys are rejected too — a validator that ignores the
      # fields it was not taught about is how a record with correct public claims
      # and forged provenance gets republished as verifier evidence
      # (codex-audit CX-052). The validator's rejection behaviour is itself
      # tested, in the build job, against forged fixtures.
      - name: Validate the result record against this job's trusted inputs
        run: |
          set -euo pipefail
          cat "${RUNNER_TEMP}/result/comparator-result.json"
          toolchain="$(tr -d '[:space:]' < lean-toolchain)"
          python3 scripts/validate_comparator_result.py \
            --result "${RUNNER_TEMP}/result/comparator-result.json" \
            --config-file "$COMPARATOR_CONFIG" \
            --config-path "$COMPARATOR_CONFIG" \
            --probe-config "$COMPARATOR_PROBE_CONFIG" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --commit "$GITHUB_SHA" \
            --toolchain "$toolchain" \
            --tool-ref "$COMPARATOR_TOOL_REF" \
            --tool-sha "$COMPARATOR_TOOL_SHA" \
            --tool-toolchain "$toolchain" \
            --landrun-ref "$LANDRUN_REF" \
            --nanoda-ref "$NANODA_REF" \
            --af-unix-guard active \
            --selftest-tier pre-run-trusted \
            --probe-tier defense-in-depth \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --max-age-seconds 43200 \
            --hash-file "comparator_config=${COMPARATOR_CONFIG}" \
            --hash-file "challenge_lean=comparator/Challenge.lean" \
            --hash-file "solution_lean=comparator/Solution.lean"

      # Resolve a *step-level* deep link to the "Run comparator" step, so the
      # comparator page's "View CI run" link lands the reader on the kernel replay
      # in the logs, not just the run summary. The lookup is by STEP name, so it
      # does not care that the step now lives in a different job. Best-effort: ANY
      # failure of the API / jq lookup falls back to the run-level URL — this step
      # MUST never fail the job (hence `set -uo pipefail` without `-e`, and
      # `|| true` on every lookup). The resolved URL is exported via $GITHUB_ENV as
      # CI_RUN_URL for the two consumers below: "Refresh comparator-status.json"
      # (writes it into run_url) and "Build Contents" (feeds
      # verso.blueprint.trust.ciRunUrl).
      - name: Resolve CI run deep link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          fallback="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          deep=""
          jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" 2>/dev/null || true)"
          if [ -n "$jobs_json" ]; then
            job="$(printf '%s' "$jobs_json" | jq -c 'first(.jobs[] | select(any(.steps[]?; .name == "Run comparator")))' 2>/dev/null || true)"
            if [ -n "$job" ] && [ "$job" != "null" ]; then
              job_id="$(printf '%s' "$job" | jq -r '.id // empty' 2>/dev/null || true)"
              step_no="$(printf '%s' "$job" | jq -r 'first(.steps[]? | select(.name == "Run comparator") | .number) // empty' 2>/dev/null || true)"
              if [ -n "$job_id" ] && [ -n "$step_no" ]; then
                deep="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/job/${job_id}#step:${step_no}:1"
              fi
            fi
          fi
          url="${deep:-$fallback}"
          echo "CI_RUN_URL=$url" >> "$GITHUB_ENV"
          echo "Resolved CI_RUN_URL=$url"

      - name: Refresh comparator-status.json
        run: |
          set -euo pipefail
          # This artifact is the sole evidence the blueprint's trust surfaces
          # quote, so everything in it is written here, by machine, and nothing
          # in it is author-typed: the claim fields come from the result record
          # the verification job emitted (which in turn copied them out of the
          # very config it passed to the tool), and the note is composed from
          # those. Nothing is asserted that the record does not carry.
          res="${RUNNER_TEMP}/result/comparator-result.json"
          run_url="${CI_RUN_URL:-${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}}"
          jq \
            --slurpfile res "$res" \
            --arg run_url "$run_url" \
            '
            ($res[0]) as $r
            | ($r.theorem_names) as $thms
            | ($r.permitted_axioms) as $axs
            | . + {
                status: $r.verdict,
                config: $r.config,
                challenge_module: $r.challenge_module,
                solution_module: $r.solution_module,
                theorem_names: $thms,
                permitted_axioms: $axs,
                verified_at: $r.finished_at,
                run_url: $run_url,
                tool_ref: $r.tool_ref,
                tool_sha: $r.tool_sha,
                tool_toolchain: $r.tool_toolchain,
                landrun_ref: $r.landrun_ref,
                nanoda_replay: $r.nanoda_replay,
                config_sha256: $r.inputs_sha256_after.comparator_config,
                challenge_sha256: $r.inputs_sha256_after.challenge_lean,
                solution_sha256: $r.inputs_sha256_after.solution_lean
              }
            | (if $r.nanoda_replay then . + { nanoda_ref: $r.nanoda_ref } else del(.nanoda_ref) end)
            | .note =
                ( "Verified in CI by leanprover/comparator " + $r.tool_ref + " (commit " + $r.tool_sha
                + "), built with " + $r.tool_toolchain + ", .github/workflows/ci.yml: the "
                + $r.solution_module + " module kernel-checks the exact " + $r.challenge_module
                + " statement" + (if ($thms | length) == 1 then " " else "s " end) + ($thms | join(", "))
                + ", using only the permitted axioms " + ($axs | join(", "))
                + ". Statement equality, axiom whitelist and Lean-kernel replay confirmed"
                + (if $r.nanoda_replay then
                     ", together with an independent replay by the nanoda kernel (ammkrn/nanoda_lib "
                     + $r.nanoda_ref + ")"
                   else "" end)
                + ". The challenge and solution modules were elaborated for the first time inside a "
                + "Landlock sandbox (Zouuup/landrun " + $r.landrun_ref + "), as were the kernel exports, "
                + "under a systemd-run AF_UNIX guard (recorded as " + $r.af_unix_guard
                + "; the run fails closed if that guard is unavailable). Before that elaboration, a probe "
                + "written by the workflow itself — importing only core Lean, with write targets chosen "
                + "per run — was put through the same sandbox wrapper: its writes outside the sandbox were "
                + "refused, while an unsandboxed control confirmed the same probe does write when nothing "
                + "stops it. After the run, a repository-side fixture attempting the same writes was also "
                + "rejected, as defense in depth. The comparator, lean4export, landrun and nanoda binaries "
                + "and the certified sources hashed identically before and after the run."
                )
            ' comparator/comparator-status.json > comparator/comparator-status.json.tmp
          mv comparator/comparator-status.json.tmp comparator/comparator-status.json
          cat comparator/comparator-status.json

      - name: Commit comparator-status.json back to main
        # Only on a real push to main. On PRs/dispatch we keep the refreshed file
        # on disk for the site build but never push. The GITHUB_TOKEN push does
        # not re-fire `push:` (and paths-ignore double-guards it). The token is
        # supplied only to this step's single push (persist-credentials is
        # false on checkout, so nothing lives in .git/config).
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- comparator/comparator-status.json; then
            echo "No change to comparator-status.json; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comparator/comparator-status.json
          git commit \
            -m "comparator: verified" \
            -m "Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      # --- Blueprint site build ----------------------------------------------
      # Only the site's own build dir is cached. The repo-root .lake/build comes
      # from the trusted build job's artifact, unpacked above; restoring a stale
      # copy over it would overlay old oleans on it, so it is deliberately NOT in
      # the cache paths. The site workspace resolves Mathlib from
      # site/.lake/packages — its LEAN_PATH never references the repo-root
      # packages, which this job never materializes.
      - name: Restore Lake package cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            site/.lake/packages
          key: ${{ runner.os }}-site-packages-v1-${{ hashFiles('site/lean-toolchain', 'site/lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-site-packages-v1-
      - name: Restore Lean build caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            site/.lake/build
          key: ${{ runner.os }}-site-build-v2-${{ hashFiles('site/lean-toolchain', 'site/lake-manifest.json', 'site/lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-site-build-v2-${{ hashFiles('site/lean-toolchain', 'site/lake-manifest.json', 'site/lakefile.lean') }}-
            ${{ runner.os }}-site-build-v2-
      - name: Get Mathlib olean cache (site)
        working-directory: site
        run: lake exe cache get || true
      - name: Disk space before the site build
        run: df -h /
      - name: Build Contents
        working-directory: site
        # `-R` (reconfigure) forces the lakefile to re-elaborate so it re-reads
        # CI_RUN_URL fresh: Lake's config trace keys off the lakefile text hash
        # (+ toolchain/platform), NOT env vars, so a warm-cache run would
        # otherwise splice in a stale run URL. The URL — the step-level deep link
        # resolved by "Resolve CI run deep link" above (via $GITHUB_ENV) — feeds
        # the `verso.blueprint.trust.ciRunUrl` lean option (see site/lakefile.lean),
        # which the comparator page uses as its CI-run link fallback.
        env:
          CI_RUN_URL: ${{ env.CI_RUN_URL }}
        run: lake build Contents -R   # never plain `lake build`: the exe target fails the MD4Lean native link
      - name: Generate site
        working-directory: site
        run: |
          rm -rf _out/site
          lake env lean --run Main.lean --output _out/site
      - name: Gates
        working-directory: site
        run: |
          set -euo pipefail
          test -f _out/site/html-multi/index.html
          test -f _out/site/html-multi/-verso-data/blueprint-manifest.json
          # The trust surfaces have to be ON DISK, not merely configured. The
          # generator probes-and-degrades throughout: the comparator page is only
          # written when a dashboard block cached the trust payload, so dropping
          # that block silently takes the whole evidence page with it, no error.
          # Their absence is exactly the kind of quiet regression a gate exists
          # for. `Trust-model` is the sluggified title of the
          # {blueprint_trust_model} page in site/Contents.lean — retitling that
          # page renames this directory, so the two move together.
          test -f _out/site/html-multi/comparator/index.html
          test -d _out/site/html-multi/Trust-model
          test -f _out/site/html-multi/Trust-model/index.html
          count="$(find _out/site/html-multi -type f | wc -l | tr -d ' ')"
          [ "$count" -ge 50 ] || { echo "only $count files"; exit 1; }
          # --- Off-origin asset gates ------------------------------------------
          # The published site must load nothing from another origin. Only ASSET
          # positions are matched: outbound <a href="https://…"> links are the
          # point of a blueprint and stay allowed.
          # NB: use `if grep …; then exit 1; fi` rather than `! grep …`. Under
          # `set -e`, a non-final `!`-inverted command that "fails" (grep found a
          # match) is exempt from -e and does NOT abort — so a `! grep` gate that
          # isn't the last statement silently false-passes. Explicit `if` is safe;
          # `exit` inside the helper below exits this shell, not just the function.
          fail_on() {  # fail_on <what> <extended regex>
            if grep -RIEl "$2" _out/site/html-multi; then
              echo "off-origin: $1 found in the generated site"
              exit 1
            fi
          }
          fail_on "jsdelivr reference(s)" "jsdelivr"
          fail_on "external <script src>/<link href>" "<(script[^>]*[[:space:]]src|link[^>]*[[:space:]]href)=[\"']https?://"
          fail_on "external media src" "<(img|iframe|embed|source|video|audio|track|object)[^>]*[[:space:]]src=[\"']https?://"
          fail_on "external CSS url()" "url\([[:space:]]*[\"']?https?://"
          fail_on "external CSS @import" "@import[[:space:]]+(url\()?[[:space:]]*[\"']?https?://"
          fail_on "off-origin fetch()/dynamic import()" "(fetch|import)\([[:space:]]*[\"']https?://"
          fail_on "off-origin ES module import" "(^|[^A-Za-z0-9_])(import|export)[^\"']*[[:space:]]from[[:space:]]*[\"']https?://"
          fail_on "protocol-relative asset reference" "[[:space:]](src|srcset)=[\"']//|<link[^>]*[[:space:]]href=[\"']//"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/_out/site/html-multi

  deploy:
    if: github.event_name != 'pull_request'
    needs: publish
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
