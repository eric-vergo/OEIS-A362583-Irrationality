name: CI

# The verification pipeline lives in eric-vergo/Showcase and is called from here. This file
# states only what is true of THIS repository; everything it runs — the trusted subject build,
# the sandboxed comparator with its Landlock self-test, denied-write probe and second-kernel
# replay, the evidence record and its validator, the site build and its gates, the release —
# is the same code every blueprint consumer runs. See `ci/README.md` in Showcase at the pinned
# commit for the contract, and `ci/scripts/` for the gates that used to live under this
# repository's `scripts/`.
#
# It replaces a 1,437-line hand-maintained workflow. The trust-boundary topology that workflow
# established (codex-audit CX-012: untrusted Lean never runs in a job holding a write token,
# and never before the sandbox) is now a property of the shared workflow, asserted on every
# push to Showcase by `tests/harness/test_blueprint_verify_topology.py`.
#
# The `uses:` ref and `showcase_sha:` below are the SAME commit `site/lakefile.lean` resolves
# for `require VersoBlueprint` (recorded in `site/lake-manifest.json`). One number to bump:
# move all three together.

on:
  push:
    branches: [main]
    paths-ignore:
      # The workflow's own commit-backs must not re-trigger it. A GITHUB_TOKEN push does not
      # fire `push:` anyway; this is the second guard.
      - 'comparator/comparator-status.json'
      - 'site/trust/kernel-identities.json'
      - 'site/trust/site-build.json'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never cancel: a cancelled run can interrupt a commit-back or a release upload.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  blueprint:
    permissions:
      contents: write   # the status / kernel-identity / site-pin commit-backs
      actions: read     # the step-level CI deep link
      # Exactly these two. A reusable workflow cannot raise its caller's grant: a job that
      # asks for a scope the caller lacks fails the run at STARTUP, before any step. Nothing
      # in the pipeline needs `actions: write` — the deploy signal is a repository_dispatch,
      # which is a contents-scope call. Neither `pages:` nor `id-token:` appears in this file
      # at all: minting a Pages token is `deploy.yml`'s business.
    uses: eric-vergo/Showcase/.github/workflows/blueprint-verify.yml@97637a6baf27e9d2f71d83d8b75ba9017b64ab80
    with:
      showcase_sha: "97637a6baf27e9d2f71d83d8b75ba9017b64ab80"
      publish_branch: main
      # The subject library and the site both build against Mathlib v4.33.1.
      mathlib: true
      # Only the subject library. `Challenge`, `Solution` and `SolutionProbe` are declared in
      # `lakefile.toml` but are not default targets and are NOT built here: their first
      # elaboration must happen inside the comparator's sandbox, in the job that holds no
      # write token (CX-012).
      subject_build_target: A362583
      # A directory, not a file: `A362583` is a library of submodules, and `A362583.olean`
      # alone would still be there after a build that compiled nothing else.
      subject_olean_probe: .lake/build/lib/lean/A362583
      # CX-012 from the other side: if the trusted job's oleans ever carried these, the
      # sandboxed build would be a no-op and the run would certify nothing.
      stale_olean_guard: "Challenge Solution SolutionProbe"
      # This repository's own check, and the one only it can state: `Challenge.lean`,
      # `Solution.lean` and `SolutionProbe.lean` each re-declare oddPrime / bit / ϱ from
      # scratch, and drift on the challenge side would quietly weaken the certified claim.
      build_check_script: scripts/check_shared_definitions.sh
      # Reader-facing prose that states a pin must state the true one: formalization.yaml and
      # the Main Theorem chapter both claimed Mathlib v4.31.0 for a full toolchain cycle after
      # the real pin moved to v4.32.0, and nothing noticed. Globs are expanded by the gate.
      prose_pin_files: "README.md formalization.yaml site/Chapters/*.lean"
      formalization_yaml: formalization.yaml
      comparator_enabled: true
      # Mathlib is in the workspace, so a `require Comparator` would drag the tool's own
      # dependency graph into it. The tool is cloned into `comparator-tool/` instead — never
      # `comparator/`, which is this repository's own folder — and given this project's
      # toolchain explicitly, so the replay runs on the kernel of the release we pin (CX-053).
      comparator_tool_mode: checkout
      comparator_config: comparator/comparator.json
      comparator_probe_config: comparator/comparator-probe.json
      comparator_challenge: comparator/Challenge.lean
      comparator_solution: comparator/Solution.lean
      comparator_status: comparator/comparator-status.json
      # Bootstrapped by the first publish run on `main`, which writes this file and commits it
      # back; asserted and never rewritten thereafter (CX-064). Until it exists the site
      # renders the second kernel as `labeled` rather than authenticated, which is the honest
      # pre-bootstrap state. The site's `expectedKernelIdentities` option and its Lake
      # `input_file` edge are added AFTER the file lands — an `input_file` on a path that does
      # not exist is a hard build failure, not a skipped edge.
      kernel_identity_pins: site/trust/kernel-identities.json
      # The site is a sub-package: its trust options and `input_file` edges are spelled `../…`,
      # so every site command runs with `site/` as the working directory.
      site_dir: site
      site_out: _out/site/html-multi
      site_lakefile: site/lakefile.lean
      site_pin: site/trust/site-build.json
      # The statement-closure helper is probed for during ELABORATION; without it the
      # comparator page records that the closure was not computed instead of showing one.
      site_prebuild_command: "lake build VersoBlueprint/statement-closure"
      # The `Contents` LIBRARY, never a bare `lake build`: the `blueprint-gen` executable
      # target fails the MD4Lean native link, and the site is generated by interpreting
      # `Main.lean` rather than by running that executable.
      site_contents_command: "lake build Contents"
      site_generate_command: "rm -rf _out/site && lake env lean --run Main.lean --output _out/site"
      # Read off a real build (379 files), never copied: page slugs derive from page TITLES,
      # so the summary page has been `Blueprint-Summary/` in one fork era and
      # `Showcase-Summary/` in another. Every path here is a surface that probes and degrades
      # — the generator writes it only when its inputs were read — so its absence is a silent
      # regression, not an error.
      required_site_files: >-
        index.html -verso-data/blueprint-manifest.json -verso-data/decl-registry.json
        -verso-data/trust-provenance.json comparator/index.html Trust-model/index.html
        Formalization-Metadata/index.html Dependency-Graph/index.html
        Showcase-Summary/index.html pm/index.html
      # ~65 % of the 379 observed. A floor catches a generator that emitted a shell of a site;
      # it is not a count assertion, and chapters legitimately come and go.
      min_site_files: 245
      # The shared default, restated because it is a real budget here and not an accident: a
      # cold run builds landrun and nanoda from source and then replays a Mathlib-scale export
      # in two kernels.
      comparator_timeout_minutes: 180
