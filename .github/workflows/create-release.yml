name: Create Release

# Manual only. This repository tags releases by hand on a semantic-version
# scheme (v1.0.0, …), so an automatic release fired on every `lean-toolchain`
# bump — which would tag toolchain-versioned releases like `v4.32.0` — is
# clutter that collides with the semver tags. Trigger this from the Actions
# tab (workflow_dispatch) if a lean-release-tag release is ever wanted.
on:
  workflow_dispatch:

jobs:
  lean-release-tag:
    name: Add Lean release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: lean-release-tag action
      # Pinned by commit. NB `@v1` here is a BRANCH, not a tag (the repo has no
      # `refs/tags/v1`), i.e. even more mutable than a marketplace major tag.
      # SHA resolved 2026-08-03 with
      #   git ls-remote https://github.com/leanprover-community/lean-release-tag.git refs/heads/v1
      uses: leanprover-community/lean-release-tag@9ca7ed09e240259871327bfc3a3a8d8c4bcb41aa # v1 branch
      with:
        do-release: true
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
